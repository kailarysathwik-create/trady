[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trady"
version = "0.1.0"
description = "Educational quantitative research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TRADY Quantitative Research Team" }
]
keywords = ["quantitative-finance", "research", "paper-trading", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.0.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.9.1",
    "tzdata>=2024.1",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
trady = "trady.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trady"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "N803",  # Argument name should be lowercase (standard ML convention uses X)
    "N806",  # Variable in function should be lowercase (standard ML convention uses X)
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
